<style>

<body>
<header><div class="mark" aria-hidden="true">∞</div><div class="brand">WoW Forever <span>TALENT ARCHIVE</span></div><a class="research-link" href="content.html">Sets, PvP & raids →</a><div class="build"><strong>1.60.1 · Build 69876</strong>Client snapshot: September 16, 2026</div></header>
<div class="app">
<nav aria-label="Choose a class" id="classes"></nav>
<main><div class="title-row"><div><h1 id="class-title"></h1><div class="sub" id="class-sub"></div></div><div class="search"><label class="sr-only" for="search" hidden>Search talents for the selected class</label><input id="search" type="search" aria-label="Search talents for the selected class" placeholder="Search talents …" autocomplete="off"><div id="search-summary" class="search-summary" aria-live="polite"></div></div></div><div class="trees" id="trees"></div></main>
<aside class="details" id="details" aria-label="Talent details"><div class="detail-inner" id="detail-content"></div></aside>
</div>
<footer id="footer"></footer>
<div class="source-dialog" id="source-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="source-title"><div class="source-box"><h2 id="source-title">Data and sources</h2><div id="source-copy"></div><button id="close-source">Close</button></div></div>
<script>
const DATA=/*TALENT_DATA*/null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentClass,selectedTalent,selectedTree,selectedEntry=0,selectedRank=1,lastFocus=null;
const ROW_HEIGHT=116;
function inspectTrees(){return [...currentClass.trees,...(currentClass.extraTalents?.length?[{id:"extra",name:"Additional client nodes",talents:currentClass.extraTalents,edges:[]}]:[])]}
function initials(name){return name.split(/\s+/).map(s=>s[0]).slice(0,2).join('')}
function iconHTML(item,detail=false){const src=item.icon||DATA.icons?.[item.iconID];return src?`<img src="${esc(src)}" alt="" loading="lazy">`:`<span class="${detail?'detail-monogram':'letters'}">${esc(initials(item.name))}</span>`}
function setClass(id,updateHash=true){
 currentClass=DATA.classes.find(c=>c.id===Number(id))||DATA.classes[0];document.documentElement.style.setProperty('--accent',currentClass.color);
 document.querySelectorAll('.class-btn').forEach(b=>{const active=Number(b.dataset.class)===currentClass.id;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});
 $('class-title').textContent=currentClass.name;$('class-sub').textContent=`${currentClass.trees.length} Talent trees · ${currentClass.trees.reduce((n,t)=>n+t.talents.length,0)} talents${currentClass.extraTalents.length?' + '+currentClass.extraTalents.length+' additional nodes':''} · Client text`;
 $('search').value='';$('search-summary').textContent='';renderTrees();
 const firstTree=currentClass.trees.find(t=>t.talents.length);if(firstTree)selectTalent(firstTree.talents[0].id,false);
 if(updateHash)history.replaceState(null,'','#'+currentClass.key);
}
function renderTrees(){
 $('trees').innerHTML=currentClass.trees.map(tree=>{
  const height=Math.max(640,(tree.rows||7)*ROW_HEIGHT+8);
  const lookup=Object.fromEntries(tree.talents.map(t=>[t.id,t]));
  const edges=tree.edges.map(edge=>{const a=lookup[edge.from],b=lookup[edge.to];if(!a||!b)return '';const ay=a.row*ROW_HEIGHT+44,by=b.row*ROW_HEIGHT;return `<path class="edge" d="M ${a.x} ${ay} V ${(ay+by)/2} H ${b.x} V ${by-5}" vector-effect="non-scaling-stroke" marker-end="url(#arrow-${tree.id})"/>`}).join('');
  return `<section class="tree" aria-label="${esc(tree.name)}"><div class="tree-head"><h2>${esc(tree.name)}</h2><p>${tree.talents.length} talents · ${tree.talents.reduce((n,t)=>n+Math.max(...t.entries.map(e=>e.maxRanks)),0)} available ranks</p></div><div class="canvas" style="height:${height}px"><svg class="connectors" viewBox="0 0 100 ${height}" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="arrow-${tree.id}" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6" fill="#8b96a5"/></marker></defs>${edges}</svg>${Array.from({length:tree.rows||7},(_,r)=>`<div class="tier-line" style="top:${r*ROW_HEIGHT+22}px"></div>`).join('')}${tree.talents.map(t=>{const entry=t.entries[0];return `<button type="button" class="talent" data-id="${t.id}" style="left:${t.x}%;top:${t.row*ROW_HEIGHT}px" aria-label="${esc(entry.name)}, ${entry.maxRanks} ${entry.maxRanks===1?'rank':'ranks'}" title="${esc(entry.name)}"><span class="talent-icon">${iconHTML(entry)}<span class="rank-count">${entry.maxRanks}</span></span><span class="talent-name">${esc(entry.name)}${t.entries.length>1?' ◇':''}</span></button>`}).join('')}</div><div class="tree-foot">Select a talent to read all ranks.</div></section>`
 }).join('');
 if(currentClass.extraTalents.length){$('trees').insertAdjacentHTML('beforeend',`<section class="extra-nodes"><h2>Additional client nodes</h2><p>These entries sit outside the regular tree grid. These data alone do not establish whether they are used.</p><div class="extra-list">${currentClass.extraTalents.map(t=>`<button class="talent extra-talent" data-id="${t.id}" title="${esc(t.entries[0].name)}"><span class="talent-icon">${iconHTML(t.entries[0])}<span class="rank-count">${t.entries[0].maxRanks}</span></span><span>${esc(t.entries[0].name)}</span></button>`).join('')}</div></section>`)}
 $('trees').querySelectorAll('.talent').forEach(b=>b.addEventListener('click',()=>selectTalent(Number(b.dataset.id),true)));
}
function selectTalent(id,open=true){
 for(const tree of inspectTrees()){const talent=tree.talents.find(t=>t.id===Number(id));if(talent){selectedTree=tree;selectedTalent=talent;break}}
 selectedEntry=0;selectedRank=1;document.querySelectorAll('.talent').forEach(b=>{const active=Number(b.dataset.id)===selectedTalent.id;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});renderDetail();
 if(open){lastFocus=document.querySelector(`.talent[data-id="${id}"]`);$('details').classList.add('open')}
}
function renderDetail(){
 const e=selectedTalent.entries[selectedEntry],rank=e.ranks?.[selectedRank-1];
 const incoming=selectedTree.edges.filter(x=>x.to===selectedTalent.id);
 const prerequisites=incoming.map(edge=>({edge,talent:selectedTree.talents.find(t=>t.id===edge.from)})).filter(p=>p.talent);
 const anyPrerequisite=incoming.length>1&&incoming.every(edge=>edge.type===2);
 let description=rank?.description||e.description||'This data snapshot does not contain a description for this talent.';
 description=esc(description).replace(/(\$[^\s.,;!]+|\[Value[^\]]*\])/g,'<span class="unresolved">$1</span>');
 $('detail-content').innerHTML=`<button class="mobile-close" aria-label="Close talent details">✕</button><div class="eyebrow">Talent details</div><div class="detail-heading">${iconHTML(e,true)}<div><h3>${esc(e.name)}</h3><div class="detail-tree">${esc(selectedTree.name)}</div></div></div>${selectedTalent.entries.length>1?`<select class="choice-select" aria-label="Talent option">${selectedTalent.entries.map((x,i)=>`<option value="${i}" ${i===selectedEntry?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}<div class="rank-label"><span>View rank</span><span>${selectedRank} / ${e.maxRanks}</span></div><div class="ranks">${Array.from({length:e.maxRanks},(_,i)=>`<button class="rank-btn ${i+1===selectedRank?'selected':''}" data-rank="${i+1}" aria-label="Rank ${i+1}" aria-pressed="${i+1===selectedRank}">${i+1}</button>`).join('')}</div><p class="description">${description}</p>${rank?.unresolved?'<div class="note">Some client expressions are unresolved. Highlighted values are preserved in their original form.</div>':''}${e.baseValueNotice?'<div class="note">Damage and healing are client base values. Level, gear and other talents may modify them.</div>':''}${selectedTree.edges.some(x=>x.warning&&(x.to===selectedTalent.id||x.from===selectedTalent.id))?'<div class="note">The beta data contain a backwards connection here. Its original direction is preserved.</div>':''}${e.curveNotice?`<div class="note">${esc(e.curveNotice)}</div>`:''}${e.ranksEstimated?'<div class="note">This is the base client description. Rank-dependent values could not be fully resolved.</div>':''}<div class="requirements"><strong>Requirements</strong>${selectedTalent.outsideGrid?'<div class="note">Outside the regular tree grid. Original position: X '+selectedTalent.sourceX+', Y '+selectedTalent.sourceY+'. Availability is unclear.</div>':''}${selectedTalent.requiredPoints!=null?`<div>${selectedTalent.requiredPoints} points in this tree</div>`:''}${anyPrerequisite?'<div>One of the following connections is sufficient:</div>':''}${prerequisites.map(({talent:t,edge})=>`<button class="req-link" data-req="${t.id}">${esc(t.entries[0].name)} · Rank ${edge.requiredRanks}</button>`).join('')}${selectedTalent.conditionNote?`<div class="note">${esc(selectedTalent.conditionNote)}</div><details class="raw-text"><summary>Additional client condition</summary><pre>${esc(JSON.stringify(selectedTalent.additionalConditions,null,2))}</pre></details>`:''}${selectedTalent.requiredPoints==null&&!prerequisites.length?'<div>No additional requirement in the linked talent data.</div>':''}</div><details class="raw-text"><summary>Show original client text</summary><pre>${esc(e.description)}</pre></details><div class="metadata"><span>Spell ${rank?.spellID||e.spellID}</span><span>Node ${selectedTalent.id}</span></div><a class="source-link" href="https://wago.tools/db2/TraitDefinition?build=1.60.1.69876&amp;filter[ID]=${e.definitionID}" target="_blank" rel="noopener">View client table ↗</a>`;
 $('detail-content').querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{selectedRank=Number(b.dataset.rank);renderDetail()});
 $('detail-content').querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>selectTalent(Number(b.dataset.req),true));
 const choice=$('detail-content').querySelector('select');if(choice)choice.onchange=()=>{selectedEntry=Number(choice.value);selectedRank=1;renderDetail()};
 $('detail-content').querySelector('.mobile-close').onclick=closeDetail;
}
function closeDetail(){$('details').classList.remove('open');lastFocus?.focus()}
function openSources(){lastFocus=document.activeElement;$('source-dialog').hidden=false;$('close-source').focus()}
function closeSources(){$('source-dialog').hidden=true;lastFocus?.focus()}
function init(){
 $('classes').innerHTML=`<div class="nav-title">Classes</div>${DATA.classes.map(c=>`<button class="class-btn" data-class="${c.id}" style="--class-color:${c.color}" aria-pressed="false" title="${esc(c.name)}">${c.icon?`<img class="class-icon" src="${c.icon}" alt="">`:`<span class="class-icon class-letter">${esc(c.name[0])}</span>`}<span class="class-name">${esc(c.name)}</span></button>`).join('')}<div class="nav-foot"><p>Beta data<br>Subject to change</p><button id="sources">Data & sources</button></div>`;
 document.querySelectorAll('.class-btn').forEach(b=>b.onclick=()=>setClass(b.dataset.class));$('sources').onclick=openSources;
 $('search').addEventListener('input',()=>{const q=$('search').value.toLocaleLowerCase().trim();let found=0;inspectTrees().forEach(tree=>tree.talents.forEach(t=>{const match=!q||t.entries.some(e=>(e.name+' '+e.description+' '+e.spellID).toLocaleLowerCase().includes(q));document.querySelector(`.talent[data-id="${t.id}"]`).classList.toggle('dim',!match);if(match)found++}));$('search-summary').textContent=q?`${found} matches in ${currentClass.name}`:''});
 $('footer').innerHTML=`${DATA.totalTalents-DATA.extraTalents} talents in 27 trees · ${DATA.extraTalents} additional client nodes · 9 classes. ${esc(DATA.localeLabel)}. <a href="#" id="footer-source">Data and notes</a>`;$('footer-source').onclick=e=>{e.preventDefault();openSources()};
 $('source-copy').innerHTML=`<p>Talent nodes, ranks, positions and connections come from <a href="https://wago.tools/builds" target="_blank" rel="noopener">Wago.Tools</a> DB2 exports for <strong>WoW Forever ${esc(DATA.build)}</strong>. Blizzard lists this build under <code>wow_classic_beta</code>.</p><p>The page contains ${DATA.totalTalents} talent nodes across all nine classes. ${DATA.extraTalents} sit outside the regular grid and are shown separately. Original English descriptions are preserved. Damage and healing use base values without character simulation. Calculable placeholders are resolved from effect and rank data; remaining dynamic expressions are explicitly marked.</p><p>This is a view of the beta snapshot from September 16, 2026. Server-side changes and hotfixes may differ. Rank buttons preview descriptions. Enable the Level 60 planner to allocate talent points.</p><p>Three nodes are positioned far outside the regular grid: Lightning Reflexes, Improved Serpent Sting and an additional Holy Specialization entry. Their original coordinates appear in the details. A backwards Hunter connection is preserved and marked on the affected talents.</p><p>Sources: <a href="https://wago.tools/db2/TraitNode?build=1.60.1.69876" target="_blank" rel="noopener">Talent nodes</a>, <a href="https://wago.tools/db2/TraitDefinition?build=1.60.1.69876" target="_blank" rel="noopener">Talent definitions</a>, <a href="https://wago.tools/db2/Spell?build=1.60.1.69876" target="_blank" rel="noopener">Spell text</a>. Icons: Blizzard game artwork, where mapped. Not affiliated with Blizzard Entertainment.</p>`;
 $('close-source').onclick=closeSources;$('source-dialog').addEventListener('click',e=>{if(e.target===$('source-dialog'))closeSources()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('source-dialog').hidden)closeSources();else closeDetail()}if(e.key==='Tab'&&!$('source-dialog').hidden){const focusables=[...$('source-dialog').querySelectorAll('a,button')];const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
 const key=location.hash.slice(1);setClass(DATA.classes.find(c=>c.key===key)?.id||8,false);
}
if(DATA)init();
</script>
</body>
</html>
